name: Deploy a producción

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Pullstok ERP al VPS
    runs-on: [self-hosted, dep]
    environment: production
    concurrency:
      group: pullstok-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sincronizar deploy.sh y ejecutar deploy
        run: |
          set -euo pipefail
          # El runner corre como "deploy"; /var/www/pullstok tiene archivos previos
          # de root, así que confiamos el directorio a git para evitar "dubious ownership".
          git config --global --add safe.directory /var/www/pullstok

          echo "::group::Deploy pullstok"
          # Poner la versión del deploy.sh del commit sobre el VPS, y ejecutarla.
          cp "$GITHUB_WORKSPACE/deploy.sh" /var/www/pullstok/deploy.sh
          chmod +x /var/www/pullstok/deploy.sh
          cd /var/www/pullstok
          ./deploy.sh
          echo "::endgroup::"